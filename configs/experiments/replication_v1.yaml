# Replication of the nine v1.0 configurations on the corrected v2 implementations.
#
# Hyperparameters are transcribed from the v1.0 tables (docs/legacy/v1_results/*_table*.JPG)
# and training uses the original episode budgets. Settings that v1.0 fixed in code rather
# than in its tables are reproduced too: per-episode epsilon decay to 0.01, tile bounds from
# the observation space, a DQN target sync every 10 episodes, learning from the first full
# batch, no gradient clipping. What differs from v1.0 is listed in docs/replication.md.
#
# Two extra variants re-introduce v1.0's learning bugs (reproduce_v1_bugs) to measure how
# much those bugs changed the results.
name: replication_v1
seeds: [0, 1, 2, 3, 4]
base:
  env: configs/env/lunarlander.yaml
  train:
    total_steps: null
  eval:
    # Learning curves for this study come from the training episodes (as in v1.0), so
    # periodic evaluation is sparse to keep the 10,000-episode REINFORCE runs affordable.
    interval_steps: 50000
    episodes: 10
    final_episodes: 100

variants:
  # ----------------------------------------------------------------- Q-learning (Tables 1-3)
  - label: q_learning_cfg1
    agent: &q_learning
      name: q_learning
      params:
        alpha: 0.5
        gamma: 0.99
        num_tilings: 16
        tiles_per_dim: 12
        table_size: 4096
        bounds: null
        epsilon: {schedule: exponential_episodes, start: 1.0, end: 0.01, decay_rate: 0.998}
    overrides: {train.total_episodes: 500}

  - label: q_learning_cfg2
    agent: *q_learning
    overrides:
      train.total_episodes: 500
      agent.params.alpha: 0.4
      agent.params.gamma: 0.90
      agent.params.epsilon.decay_rate: 0.995

  - label: q_learning_cfg3
    agent: *q_learning
    overrides:
      train.total_episodes: 500
      agent.params.epsilon.decay_rate: 0.995
      agent.params.num_tilings: 18
      agent.params.tiles_per_dim: 8
      agent.params.table_size: 8192

  - label: q_learning_cfg1_v1bugs
    agent: *q_learning
    overrides:
      train.total_episodes: 500
      agent.params.reproduce_v1_bugs: true

  # ------------------------------------------------------------------------ DQN (Tables 4-6)
  - label: dqn_cfg1
    agent: &dqn
      name: dqn
      params:
        hidden_sizes: [64, 64]
        lr: 1.0e-3
        gamma: 0.99
        batch_size: 64
        buffer_size: 10000
        # v1.0 learned once the buffer held more than one batch.
        learning_starts: 65
        train_frequency: 1
        gradient_steps: 1
        target_update_interval: 10
        target_update_unit: episodes
        loss: huber
        max_grad_norm: null
        epsilon: {schedule: exponential_episodes, start: 1.0, end: 0.01, decay_rate: 0.995}
    overrides: {train.total_episodes: 1000}

  - label: dqn_cfg2
    agent: *dqn
    overrides:
      train.total_episodes: 1000
      agent.params.lr: 5.0e-3

  - label: dqn_cfg3
    agent: *dqn
    overrides:
      train.total_episodes: 1000
      agent.params.gamma: 0.90
      agent.params.buffer_size: 50000
      agent.params.loss: mse

  - label: dqn_cfg1_v1bugs
    agent: *dqn
    overrides:
      train.total_episodes: 1000
      agent.params.reproduce_v1_bugs: true

  # ------------------------------------------------------------------ REINFORCE (Tables 7-9)
  - label: reinforce_cfg1
    agent: &reinforce
      name: reinforce
      params:
        hidden_sizes: [128]
        lr: 1.0e-3
        gamma: 0.99
        baseline: normalize
        entropy_coef: 0.0
    overrides: {train.total_episodes: 10000}

  - label: reinforce_cfg2
    agent: *reinforce
    overrides:
      train.total_episodes: 10000
      agent.params.lr: 1.0e-2
      agent.params.gamma: 0.95

  - label: reinforce_cfg3
    agent: *reinforce
    overrides:
      train.total_episodes: 10000
      agent.params.lr: 5.0e-4
      agent.params.gamma: 0.999
      agent.params.hidden_sizes: [256]
