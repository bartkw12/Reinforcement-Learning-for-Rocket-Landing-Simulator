# Stable-Baselines3 PPO with RL Baselines3 Zoo's tuned hyperparameters for LunarLander-v3
# (rl-baselines3-zoo, hyperparams/ppo.yml, tuned for a 1M-step budget). Values the Zoo
# does not set are SB3's defaults, written out for clarity.
name: sb3_ppo
params:
  n_envs: 16
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.999
  gae_lambda: 0.98
  ent_coef: 0.01
  learning_rate: 3.0e-4
  clip_range: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  activation: tanh
