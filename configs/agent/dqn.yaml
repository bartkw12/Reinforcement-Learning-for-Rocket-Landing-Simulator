# DQN as selected by tuning for a budget of 1M environment steps
# (configs/experiments/tuning.yaml, results/tables/tuning.md). These are RL Baselines3 Zoo's
# tuned values for LunarLander-v3 (hyperparams/dqn.yml) with the learning rate lowered from
# 6.3e-4 to 3e-4: the Zoo tuned for 100k steps, and at 1M its final policies collapsed.
# configs/agent/sb3_dqn.yaml uses the same values, so SB3's DQN checks this implementation.
name: dqn
params:
  hidden_sizes: [256, 256]
  lr: 3.0e-4
  gamma: 0.99
  batch_size: 128
  buffer_size: 50000
  learning_starts: 0
  train_frequency: 4
  gradient_steps: 4
  target_update_interval: 250
  target_update_unit: steps
  double: false
  loss: huber
  max_grad_norm: 10.0
  epsilon:
    schedule: linear_steps
    start: 1.0
    end: 0.1
    decay_steps: 12000
